<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astralis | N-Body Orbital Gravity & Spacetime Sandbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #05060e; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #e5e7eb; }
    #canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    
    .panel {
      position: absolute; background: rgba(8, 12, 22, 0.8); backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 197, 255, 0.18); border-radius: 10px; padding: 12px 16px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.06); z-index: 10;
    }
    #top-bar { top: 16px; left: 16px; display: flex; align-items: center; gap: 12px; }
    #stats-bar { top: 16px; right: 16px; font-size: 12px; font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; display: flex; gap: 14px; color: #cbd5e1; }
    #controls { bottom: 16px; left: 16px; display: flex; flex-direction: column; gap: 10px; width: 280px; }
    #archetypes { bottom: 16px; right: 16px; display: flex; gap: 8px; }

    h1 { font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: 0.14em; text-transform: uppercase; margin: 0; text-shadow: 0 0 14px rgba(56, 189, 248, 0.4); }
    .badge { font-size: 10px; background: transparent; color: #7dd3fc; border: 1px solid rgba(125, 211, 252, 0.5); padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.08em; }

    button, select {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e5e7eb; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
      transition: all 0.2s ease; outline: none;
    }
    button:hover, select:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.3); }
    button.active { background: #0e7490; border-color: #22d3ee; color: #f0fdfa; font-weight: 600; }
    
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .btn-group { display: flex; gap: 6px; width: 100%; }
    .btn-group button { flex: 1; text-align: center; }

    .archetype-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 10px; min-width: 65px;
    }
    .archetype-btn .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

    #hud {
      position: absolute; pointer-events: none; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
    }
  </style>
</head>
<body>
  <div id="top-bar" class="panel">
    <h1>Astralis</h1>
    <span class="badge">N-Body Sandbox</span>
    <select id="preset-select">
      <option value="binary">Preset: Binary Star Dance</option>
      <option value="solar">Preset: Inner Solar System</option>
      <option value="figure8">Preset: Figure-8 Three-Body</option>
      <option value="accretion">Preset: Black Hole Accretion</option>
      <option value="chaos">Preset: Chaos Cluster</option>
    </select>
  </div>

  <div id="stats-bar" class="panel">
    <div>BODIES: <span id="stat-bodies">0</span></div>
    <div>FPS: <span id="stat-fps">60</span></div>
    <div>TIME: <span id="stat-time">1.0x</span></div>
  </div>

  <div id="controls" class="panel">
    <div class="row">
      <span>Simulation</span>
      <div class="btn-group">
        <button id="btn-pause">Pause</button>
        <button id="btn-step">Step</button>
        <button id="btn-clear">Clear</button>
      </div>
    </div>
    <div class="row">
      <span>Collisions</span>
      <div class="btn-group">
        <button id="btn-merge" class="active">Merge</button>
        <button id="btn-shatter">Shatter</button>
      </div>
    </div>
    <div class="row">
      <span>Visuals</span>
      <div class="btn-group">
        <button id="btn-grid" class="active">Grid</button>
        <button id="btn-trails" class="active">Trails</button>
        <button id="btn-fx" class="active" title="Toggle cinematic starfield, glows, and shading">FX</button>
        <button id="btn-audio">Audio</button>
      </div>
    </div>
  </div>

  <div id="archetypes" class="panel">
    <button class="archetype-btn active" data-type="asteroid">
      <span class="dot" style="background:#9ca3af;"></span>
      <span>Asteroid</span>
    </button>
    <button class="archetype-btn" data-type="rocky">
      <span class="dot" style="background:#38bdf8;"></span>
      <span>Rocky</span>
    </button>
    <button class="archetype-btn" data-type="gas">
      <span class="dot" style="background:#fbbf24;"></span>
      <span>Gas Giant</span>
    </button>
    <button class="archetype-btn" data-type="star">
      <span class="dot" style="background:#f97316; box-shadow: 0 0 8px #f97316;"></span>
      <span>Star</span>
    </button>
    <button class="archetype-btn" data-type="black_hole">
      <span class="dot" style="background:#000; border: 1px solid #a855f7; box-shadow: 0 0 8px #a855f7;"></span>
      <span>Singularity</span>
    </button>
  </div>

  <canvas id="canvas"></canvas>
  <canvas id="hud"></canvas>

  <script>
    /* =========================================================================
       MODULE 1: CONSTANTS & CONFIGURATION
       ========================================================================= */
    const G = 1.0;
    const SOFTENING = 5.0;
    const SUB_STEPS = 4;
    const DT = 0.016;

    const ARCHETYPES = {
      asteroid:   { mass: 0.5,   radius: 3,  color: "#9ca3af", glow: null },
      rocky:      { mass: 10,    radius: 5,  color: "#38bdf8", glow: "rgba(56,189,248,0.4)" },
      gas:        { mass: 150,   radius: 9,  color: "#fbbf24", glow: "rgba(251,191,36,0.5)" },
      star:       { mass: 3000,  radius: 16, color: "#f97316", glow: "rgba(249,115,22,0.8)" },
      black_hole: { mass: 12000, radius: 10, color: "#000000", glow: "rgba(168,85,247,0.9)", ring: true }
    };

    let state = {
      paused: false,
      collisionMode: "merge",
      showGrid: true,
      showTrails: true,
      cinematic: true,
      audioEnabled: false,
      selectedArchetype: "asteroid",
      camera: { x: 0, y: 0, zoom: 1.0 },
      isDragging: false,
      dragStart: { x: 0, y: 0 },
      dragCurrent: { x: 0, y: 0 },
      isPanning: false,
      panStart: { x: 0, y: 0 }
    };

    let bodies = [];
    let particles = [];
    let audioCtx = null;

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const hudCanvas = document.getElementById("hud");
    const hudCtx = hudCanvas.getContext("2d");

    function resize() {
      canvas.width = hudCanvas.width = window.innerWidth;
      canvas.height = hudCanvas.height = window.innerHeight;
      state.camera.x = canvas.width / 2;
      state.camera.y = canvas.height / 2;
      if (typeof rebuildBackground === "function") rebuildBackground();
    }
    window.addEventListener("resize", resize);

    /* =========================================================================
       MODULE 1b: CINEMATIC ASSETS (allocated once, reused every frame)
       ========================================================================= */
    const STAR_N = 240;
    const starNX = new Float32Array(STAR_N);
    const starNY = new Float32Array(STAR_N);
    const starPhase = new Float32Array(STAR_N);
    const starSpeed = new Float32Array(STAR_N);
    const starSize = new Float32Array(STAR_N);
    const starLayer = new Uint8Array(STAR_N);
    const STAR_TINTS = ["#f8fafc", "#dbeafe", "#fde68a"];

    const GRID_STYLES = [
      "rgba(125, 148, 176, 0.13)",
      "rgba(96, 176, 206, 0.20)",
      "rgba(72, 196, 214, 0.28)",
      "rgba(129, 162, 255, 0.36)",
      "rgba(186, 146, 255, 0.46)"
    ];
    const GRID_STYLE_FLAT = "rgba(75, 85, 99, 0.22)";
    const PHOTON_RING = "rgba(216, 180, 254, 0.9)";
    const HORIZON_EDGE = "rgba(255, 255, 255, 0.38)";
    const GAS_BAND = "rgba(255, 255, 255, 0.85)";
    const ASTEROID_HL = "rgba(255, 255, 255, 0.35)";
    const STAR_CORE = "#fff7ed";
    const BH_GLOW = "#a855f7";

    let warpDx = 0;
    let warpDy = 0;
    let warpMag = 0;
    let visualTime = 0;
    let bgCanvas = null;
    let sphereSprite = null;
    let diskSprite = null;
    const glowCache = new Map();

    function initStarfield() {
      for (let i = 0; i < STAR_N; i++) {
        starNX[i] = Math.random();
        starNY[i] = Math.random();
        starPhase[i] = Math.random() * Math.PI * 2;
        starSpeed[i] = 0.6 + Math.random() * 1.8;
        const layer = (i % 11 === 0) ? 2 : (i % 3 === 0) ? 1 : 0;
        starLayer[i] = layer;
        starSize[i] = layer === 2 ? 2.1 : layer === 1 ? 1.35 : 0.85;
      }
    }

    function bakeGlow(color) {
      const size = 128;
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const g = c.getContext("2d");
      const r = size / 2;
      const grad = g.createRadialGradient(r, r, 0, r, r, r);
      grad.addColorStop(0, "rgba(255,255,255,0.95)");
      grad.addColorStop(0.22, "rgba(255,255,255,0.55)");
      grad.addColorStop(0.55, "rgba(255,255,255,0.14)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      g.globalCompositeOperation = "source-in";
      g.fillStyle = color;
      g.fillRect(0, 0, size, size);
      return c;
    }

    function glowFor(color) {
      let sprite = glowCache.get(color);
      if (!sprite) {
        sprite = bakeGlow(color);
        glowCache.set(color, sprite);
      }
      return sprite;
    }

    function bakeSphere() {
      const size = 128;
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const g = c.getContext("2d");
      const r = size / 2;
      const light = g.createRadialGradient(r * 0.62, r * 0.55, r * 0.04, r * 0.62, r * 0.55, r * 0.95);
      light.addColorStop(0, "rgba(255,255,255,0.72)");
      light.addColorStop(0.42, "rgba(255,255,255,0.08)");
      light.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = light;
      g.beginPath();
      g.arc(r, r, r, 0, Math.PI * 2);
      g.fill();
      const rim = g.createRadialGradient(r, r, r * 0.55, r, r, r);
      rim.addColorStop(0, "rgba(0,0,0,0)");
      rim.addColorStop(0.72, "rgba(0,0,0,0.08)");
      rim.addColorStop(1, "rgba(0,0,0,0.62)");
      g.fillStyle = rim;
      g.beginPath();
      g.arc(r, r, r, 0, Math.PI * 2);
      g.fill();
      return c;
    }

    function bakeDisk() {
      const size = 256;
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const g = c.getContext("2d");
      const cx = size / 2;
      const cy = size / 2;
      for (let i = 0; i < 56; i++) {
        const a0 = (i / 56) * Math.PI * 2;
        const hot = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(a0));
        g.strokeStyle = "rgba(253, 186, 116, " + (0.12 + hot * 0.72).toFixed(3) + ")";
        g.lineWidth = 8;
        g.beginPath();
        g.arc(cx, cy, 74, a0, a0 + 0.14);
        g.stroke();
        g.strokeStyle = "rgba(167, 139, 250, " + (0.04 + hot * 0.28).toFixed(3) + ")";
        g.lineWidth = 18;
        g.beginPath();
        g.arc(cx, cy, 90, a0, a0 + 0.14);
        g.stroke();
      }
      g.globalCompositeOperation = "destination-out";
      g.beginPath();
      g.arc(cx, cy, 42, 0, Math.PI * 2);
      g.fill();
      return c;
    }

    function rebuildBackground() {
      const pad = 24;
      const w = canvas.width + pad * 2;
      const h = canvas.height + pad * 2;
      if (w < 2 || h < 2) return;
      bgCanvas = document.createElement("canvas");
      bgCanvas.width = w;
      bgCanvas.height = h;
      const g = bgCanvas.getContext("2d");
      g.fillStyle = "#05060e";
      g.fillRect(0, 0, w, h);

      function blob(px, py, radius, color) {
        const grad = g.createRadialGradient(px, py, 0, px, py, radius);
        grad.addColorStop(0, color);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = grad;
        g.fillRect(px - radius, py - radius, radius * 2, radius * 2);
      }

      blob(w * 0.22, h * 0.28, Math.max(w, h) * 0.42, "rgba(76, 29, 149, 0.34)");
      blob(w * 0.78, h * 0.72, Math.max(w, h) * 0.38, "rgba(14, 116, 144, 0.22)");
      blob(w * 0.55, h * 0.42, Math.max(w, h) * 0.28, "rgba(30, 64, 175, 0.20)");

      g.save();
      g.translate(w * 0.5, h * 0.48);
      g.rotate(-0.35);
      g.scale(1, 0.22);
      const band = g.createRadialGradient(0, 0, 20, 0, 0, w * 0.55);
      band.addColorStop(0, "rgba(186, 210, 255, 0.10)");
      band.addColorStop(1, "rgba(186, 210, 255, 0)");
      g.fillStyle = band;
      g.beginPath();
      g.arc(0, 0, w * 0.55, 0, Math.PI * 2);
      g.fill();
      g.restore();

      const vignette = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.28, w / 2, h / 2, Math.max(w, h) * 0.72);
      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(0,0,0,0.62)");
      g.fillStyle = vignette;
      g.fillRect(0, 0, w, h);
    }

    function initCinematicAssets() {
      initStarfield();
      sphereSprite = bakeSphere();
      diskSprite = bakeDisk();
      const prewarm = ["#f97316", "#38bdf8", "#fbbf24", "#34d399", "#ec4899", "#3b82f6", "#10b981", "#fcd34d", "#f87171", BH_GLOW];
      for (let i = 0; i < prewarm.length; i++) glowFor(prewarm[i]);
    }
    initCinematicAssets();
    resize();

    /* =========================================================================
       MODULE 2: AUDIO SYNTHESIZER
       ========================================================================= */
    function playTone(freq, duration = 0.15, type = "sine") {
      if (!state.audioEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    /* =========================================================================
       MODULE 3: PHYSICS ENGINE (VELOCITY VERLET)
       ========================================================================= */
    function computeAccelerations(bodyList) {
      const n = bodyList.length;
      const ax = new Float64Array(n);
      const ay = new Float64Array(n);

      for (let i = 0; i < n; i++) {
        const bi = bodyList[i];
        for (let j = i + 1; j < n; j++) {
          const bj = bodyList[j];
          const dx = bj.x - bi.x;
          const dy = bj.y - bi.y;
          const distSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
          const dist = Math.sqrt(distSq);
          const force = (G * bi.mass * bj.mass) / distSq;
          
          const fx = (force * dx) / dist;
          const fy = (force * dy) / dist;

          ax[i] += fx / bi.mass;
          ay[i] += fy / bi.mass;
          ax[j] -= fx / bj.mass;
          ay[j] -= fy / bj.mass;
        }
      }
      return { ax, ay };
    }

    function stepPhysics(subDt) {
      if (bodies.length === 0) return;

      const { ax: ax1, ay: ay1 } = computeAccelerations(bodies);

      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        b.vx += 0.5 * ax1[i] * subDt;
        b.vy += 0.5 * ay1[i] * subDt;
        b.x += b.vx * subDt;
        b.y += b.vy * subDt;

        if (state.showTrails && Math.random() < 0.2) {
          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 40) b.trail.shift();
        }
      }

      const { ax: ax2, ay: ay2 } = computeAccelerations(bodies);

      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        b.vx += 0.5 * ax2[i] * subDt;
        b.vy += 0.5 * ay2[i] * subDt;
      }

      resolveCollisions();
    }

    function resolveCollisions() {
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const b1 = bodies[i];
          const b2 = bodies[j];
          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);

          if (dist < (b1.radius + b2.radius) * 0.8) {
            handleCollision(i, j);
            return;
          }
        }
      }
    }

    function handleCollision(i, j) {
      const b1 = bodies[i];
      const b2 = bodies[j];
      const primary = b1.mass >= b2.mass ? b1 : b2;
      const secondary = b1.mass >= b2.mass ? b2 : b1;

      if (state.collisionMode === "merge") {
        const totalMass = primary.mass + secondary.mass;
        primary.vx = (primary.vx * primary.mass + secondary.vx * secondary.mass) / totalMass;
        primary.vy = (primary.vy * primary.mass + secondary.vy * secondary.mass) / totalMass;
        primary.mass = totalMass;
        primary.radius = Math.max(primary.radius, Math.cbrt(Math.pow(primary.radius, 3) + Math.pow(secondary.radius, 3)));
        
        spawnExplosion(secondary.x, secondary.y, secondary.color, 12);
        playTone(180, 0.2, "triangle");
        bodies = bodies.filter(b => b !== secondary);
      } else {
        spawnExplosion((b1.x + b2.x) / 2, (b1.y + b2.y) / 2, "#f87171", 30);
        playTone(320, 0.3, "sawtooth");
        bodies = bodies.filter((_, idx) => idx !== i && idx !== j);
      }
    }

    function spawnExplosion(x, y, color, count) {
      for (let k = 0; k < count; k++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          life: 1.0,
          decay: Math.random() * 0.03 + 0.015
        });
      }
    }

    /* =========================================================================
       MODULE 4: PRESETS
       ========================================================================= */
    function loadPreset(name) {
      bodies = [];
      particles = [];

      if (name === "binary") {
        bodies.push(
          { id: 1, x: -90, y: 0, vx: 0, vy: -3.8, mass: 2200, radius: 14, color: "#f97316", type: "star", trail: [] },
          { id: 2, x: 90, y: 0, vx: 0, vy: 3.8, mass: 2200, radius: 14, color: "#38bdf8", type: "star", trail: [] },
          { id: 3, x: 260, y: 0, vx: 0, vy: 4.8, mass: 12, radius: 6, color: "#34d399", type: "rocky", trail: [] }
        );
      } else if (name === "solar") {
        bodies.push(
          { id: 1, x: 0, y: 0, vx: 0, vy: 0, mass: 4500, radius: 18, color: "#fbbf24", type: "star", trail: [] },
          { id: 2, x: 80, y: 0, vx: 0, vy: 7.5, mass: 2, radius: 4, color: "#9ca3af", type: "rocky", trail: [] },
          { id: 3, x: 150, y: 0, vx: 0, vy: 5.5, mass: 8, radius: 6, color: "#38bdf8", type: "rocky", trail: [] },
          { id: 4, x: 230, y: 0, vx: 0, vy: 4.4, mass: 6, radius: 5, color: "#f87171", type: "rocky", trail: [] },
          { id: 5, x: 340, y: 0, vx: 0, vy: 3.6, mass: 80, radius: 10, color: "#fcd34d", type: "gas", trail: [] }
        );
      } else if (name === "figure8") {
        const m = 1500;
        const x1 = -180, y1 = 0, vx1 = 1.95, vy1 = 1.82;
        bodies.push(
          { id: 1, x: x1, y: y1, vx: vx1, vy: vy1, mass: m, radius: 12, color: "#ec4899", type: "star", trail: [] },
          { id: 2, x: -x1, y: -y1, vx: vx1, vy: vy1, mass: m, radius: 12, color: "#3b82f6", type: "star", trail: [] },
          { id: 3, x: 0, y: 0, vx: -2 * vx1, vy: -2 * vy1, mass: m, radius: 12, color: "#10b981", type: "star", trail: [] }
        );
      } else if (name === "accretion") {
        bodies.push({ id: 1, x: 0, y: 0, vx: 0, vy: 0, mass: 12000, radius: 12, color: "#000000", type: "black_hole", trail: [] });
        for (let i = 0; i < 90; i++) {
          const r = Math.random() * 240 + 70;
          const theta = Math.random() * Math.PI * 2;
          const v = Math.sqrt((G * 12000) / r);
          bodies.push({
            id: 10 + i,
            x: Math.cos(theta) * r,
            y: Math.sin(theta) * r,
            vx: -Math.sin(theta) * v,
            vy: Math.cos(theta) * v,
            mass: 0.2,
            radius: 2,
            color: "#e2e8f0",
            type: "asteroid",
            trail: []
          });
        }
      } else if (name === "chaos") {
        for (let i = 0; i < 18; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 250;
          bodies.push({
            id: i,
            x: Math.cos(angle) * dist,
            y: Math.sin(angle) * dist,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            mass: Math.random() * 400 + 40,
            radius: Math.random() * 5 + 4,
            color: `hsl(${Math.random() * 360}, 75%, 60%)`,
            type: "rocky",
            trail: []
          });
        }
      }
    }

    /* =========================================================================
       MODULE 5: TRAJECTORY PREDICTION (SLINGSHOT)
       ========================================================================= */
    function predictTrajectory(startX, startY, vx, vy, mass, radius) {
      const simSteps = 220;
      const stepDt = 0.12;
      const path = [];
      let x = startX, y = startY, curVx = vx, curVy = vy;
      let status = "BOUND ORBIT";

      for (let s = 0; s < simSteps; s++) {
        let ax = 0, ay = 0;
        for (let b of bodies) {
          const dx = b.x - x;
          const dy = b.y - y;
          const dSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
          const d = Math.sqrt(dSq);
          if (d < b.radius + radius) {
            status = "IMPACT";
            path.push({ x, y });
            return { path, status };
          }
          const f = (G * b.mass) / dSq;
          ax += (f * dx) / d;
          ay += (f * dy) / d;
        }

        curVx += ax * stepDt;
        curVy += ay * stepDt;
        x += curVx * stepDt;
        y += curVy * stepDt;
        path.push({ x, y });

        if (Math.hypot(x, y) > 2800) {
          status = "ESCAPE";
          break;
        }
      }
      return { path, status };
    }

    /* =========================================================================
       MODULE 6: RENDERING & VISUAL PIPELINE
       Cinematic sprites, star buffers, and grid scratch values are allocated
       once. This path does not allocate per sample or per body.
       ========================================================================= */
    function warpBucket() {
      const m = warpMag;
      if (m < 0.35) return 0;
      if (m < 0.9) return 1;
      if (m < 2.2) return 2;
      if (m < 5) return 3;
      return 4;
    }

    function drawBackdrop() {
      const pad = 24;
      const driftX = Math.sin(visualTime * 0.07) * 10;
      const driftY = Math.cos(visualTime * 0.05) * 8;
      ctx.fillStyle = "#05060e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (bgCanvas) ctx.drawImage(bgCanvas, -pad + driftX, -pad + driftY);
      drawStarfield();
    }

    function drawStarfield() {
      const w = canvas.width;
      const h = canvas.height;
      const ox = state.camera.x - w * 0.5;
      const oy = state.camera.y - h * 0.5;
      const zoomPull = (state.camera.zoom - 1) * 16;
      let tint = -1;
      for (let i = 0; i < STAR_N; i++) {
        const layer = starLayer[i];
        const depth = layer === 0 ? 0.03 : layer === 1 ? 0.1 : 0.24;
        let sx = starNX[i] * w - ox * depth - zoomPull * depth;
        let sy = starNY[i] * h - oy * depth;
        sx %= w;
        if (sx < 0) sx += w;
        sy %= h;
        if (sy < 0) sy += h;
        const want = layer === 2 ? (i % 3) : 0;
        if (want !== tint) {
          tint = want;
          ctx.fillStyle = STAR_TINTS[want];
        }
        const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(visualTime * starSpeed[i] + starPhase[i]));
        const size = starSize[i];
        ctx.globalAlpha = layer === 0 ? tw * 0.4 : layer === 1 ? tw * 0.72 : tw;
        ctx.fillRect(sx, sy, size, size);
        if (layer === 2) {
          ctx.globalAlpha *= 0.4;
          ctx.fillRect(sx - 2.4, sy + size * 0.3, size + 4.8, 0.7);
          ctx.fillRect(sx + size * 0.3, sy - 2.4, 0.7, size + 4.8);
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawGrid() {
      const zoom = state.camera.zoom;
      const cinematic = state.cinematic;
      ctx.lineWidth = 1 / zoom;
      ctx.lineCap = cinematic ? "round" : "butt";
      ctx.lineJoin = cinematic ? "round" : "miter";
      if (!cinematic) ctx.strokeStyle = GRID_STYLE_FLAT;
      const gridSize = 45;
      const range = 1400;

      for (let x = -range; x <= range; x += gridSize) {
        ctx.beginPath();
        let maxB = 0;
        for (let y = -range; y <= range; y += 20) {
          computeGridWarp(x, y);
          if (cinematic) {
            const bkt = warpBucket();
            if (bkt > maxB) maxB = bkt;
          }
          if (y === -range) ctx.moveTo(x + warpDx, y + warpDy);
          else ctx.lineTo(x + warpDx, y + warpDy);
        }
        if (cinematic) ctx.strokeStyle = GRID_STYLES[maxB];
        ctx.stroke();
      }

      for (let y = -range; y <= range; y += gridSize) {
        ctx.beginPath();
        let maxB = 0;
        for (let x = -range; x <= range; x += 20) {
          computeGridWarp(x, y);
          if (cinematic) {
            const bkt = warpBucket();
            if (bkt > maxB) maxB = bkt;
          }
          if (x === -range) ctx.moveTo(x + warpDx, y + warpDy);
          else ctx.lineTo(x + warpDx, y + warpDy);
        }
        if (cinematic) ctx.strokeStyle = GRID_STYLES[maxB];
        ctx.stroke();
      }
    }

    function drawTrails() {
      const zoom = state.camera.zoom;
      const cinematic = state.cinematic;
      const nBodies = bodies.length;
      for (let i = 0; i < nBodies; i++) {
        const b = bodies[i];
        const trail = b.trail;
        const n = trail.length;
        if (n < 2) continue;
        ctx.strokeStyle = b.color;
        if (!cinematic || b.type === "asteroid") {
          ctx.globalCompositeOperation = "source-over";
          ctx.lineCap = "butt";
          ctx.lineWidth = 1.2 / zoom;
          ctx.globalAlpha = 0.35;
          ctx.beginPath();
          ctx.moveTo(trail[0].x, trail[0].y);
          for (let t = 1; t < n; t++) ctx.lineTo(trail[t].x, trail[t].y);
          ctx.stroke();
          continue;
        }
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = (b.type === "star" || b.type === "black_hole" ? 2.5 : 1.7) / zoom;
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let t = 1; t < n; t++) ctx.lineTo(trail[t].x, trail[t].y);
        ctx.stroke();
        const start = n > 12 ? n - 12 : 0;
        ctx.globalAlpha = 0.8;
        ctx.lineWidth = 1.35 / zoom;
        ctx.beginPath();
        ctx.moveTo(trail[start].x, trail[start].y);
        for (let t = start + 1; t < n; t++) ctx.lineTo(trail[t].x, trail[t].y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    function drawStar(b) {
      const pulse = 1 + 0.04 * Math.sin(visualTime * 2.3 + b.id * 0.01);
      const glow = glowFor(b.color);
      const s = b.radius * 3.5 * pulse;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.42;
      const wide = s * 1.7;
      ctx.drawImage(glow, b.x - wide, b.y - wide, wide * 2, wide * 2);
      ctx.globalAlpha = 0.9;
      ctx.drawImage(glow, b.x - s, b.y - s, s * 2, s * 2);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = STAR_CORE;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * 0.42 * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlanet(b) {
      if (b.type === "gas") {
        const glow = glowFor(b.color);
        const s = b.radius * 2.5;
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.5;
        ctx.drawImage(glow, b.x - s, b.y - s, s * 2, s * 2);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.clip();
      if (b.type === "gas") {
        ctx.globalAlpha = 0.22;
        ctx.strokeStyle = GAS_BAND;
        ctx.lineWidth = Math.max(0.8, b.radius * 0.13);
        const y0 = b.y - b.radius * 0.45;
        for (let k = 0; k < 4; k++) {
          const y = y0 + k * b.radius * 0.28;
          ctx.beginPath();
          ctx.moveTo(b.x - b.radius, y);
          ctx.lineTo(b.x + b.radius, y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      ctx.drawImage(sphereSprite, b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);
      ctx.restore();
    }

    function drawBlackHole(b) {
      const glow = glowFor(BH_GLOW);
      const s = b.radius * 6.5;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.8;
      ctx.drawImage(glow, b.x - s, b.y - s, s * 2, s * 2);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(visualTime * 0.4);
      ctx.scale(1, 0.36);
      const d = b.radius * 5.4;
      ctx.drawImage(diskSprite, -d, -d, d * 2, d * 2);
      ctx.restore();
      ctx.strokeStyle = PHOTON_RING;
      ctx.lineWidth = Math.max(1.1 / state.camera.zoom, b.radius * 0.11);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * 1.32, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = HORIZON_EDGE;
      ctx.lineWidth = 1 / state.camera.zoom;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * 1.02, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawAsteroid(b) {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fill();
      if (b.radius >= 3) {
        ctx.fillStyle = ASTEROID_HL;
        ctx.beginPath();
        ctx.arc(b.x - b.radius * 0.28, b.y - b.radius * 0.28, b.radius * 0.32, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBodies() {
      const n = bodies.length;
      if (!state.cinematic) {
        for (let i = 0; i < n; i++) {
          const b = bodies[i];
          if (b.type === "black_hole") {
            const grad = ctx.createRadialGradient(b.x, b.y, b.radius * 0.8, b.x, b.y, b.radius * 2.8);
            grad.addColorStop(0, "rgba(0,0,0,1)");
            grad.addColorStop(0.4, "rgba(168,85,247,0.8)");
            grad.addColorStop(1, "rgba(168,85,247,0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius * 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
          } else {
            const spec = ARCHETYPES[b.type];
            if (spec && spec.glow) {
              ctx.shadowColor = spec.color;
              ctx.shadowBlur = b.radius * 2.2;
            }
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }
        return;
      }
      for (let i = 0; i < n; i++) {
        const b = bodies[i];
        if (b.type === "black_hole") drawBlackHole(b);
        else if (b.type === "star") drawStar(b);
        else if (b.type === "gas" || b.type === "rocky") drawPlanet(b);
        else drawAsteroid(b);
      }
    }

    function drawParticles() {
      if (state.cinematic) ctx.globalCompositeOperation = "lighter";
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    function draw() {
      if (state.cinematic) drawBackdrop();
      else {
        ctx.fillStyle = "#050608";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.save();
      ctx.translate(state.camera.x, state.camera.y);
      ctx.scale(state.camera.zoom, state.camera.zoom);
      if (state.showGrid) drawGrid();
      if (state.showTrails) drawTrails();
      drawBodies();
      drawParticles();
      ctx.restore();
      renderSlingshotHUD();
    }

    function computeGridWarp(x, y) {
      warpDx = 0;
      warpDy = 0;
      const n = bodies.length;
      for (let i = 0; i < n; i++) {
        const b = bodies[i];
        const distSq = (b.x - x) ** 2 + (b.y - y) ** 2 + 100;
        const pull = Math.min(b.mass * 0.08 / distSq, 14);
        const dist = Math.sqrt(distSq);
        warpDx += ((b.x - x) / dist) * pull;
        warpDy += ((b.y - y) / dist) * pull;
      }
      warpMag = Math.sqrt(warpDx * warpDx + warpDy * warpDy);
    }

    function renderSlingshotHUD() {
      hudCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
      if (!state.isDragging) return;

      const sx = state.dragStart.x;
      const sy = state.dragStart.y;
      const cx = state.dragCurrent.x;
      const cy = state.dragCurrent.y;

      const vx = (sx - cx) * 0.06;
      const vy = (sy - cy) * 0.06;

      const worldStart = screenToWorld(sx, sy);
      const spec = ARCHETYPES[state.selectedArchetype];
      const { path, status } = predictTrajectory(worldStart.x, worldStart.y, vx, vy, spec.mass, spec.radius);

      hudCtx.beginPath();
      hudCtx.setLineDash([4, 4]);
      hudCtx.strokeStyle = status === "IMPACT" ? "#f87171" : status === "ESCAPE" ? "#fbbf24" : "#38bdf8";
      hudCtx.lineWidth = 1.5;

      for (let i = 0; i < path.length; i++) {
        const scr = worldToScreen(path[i].x, path[i].y);
        if (i === 0) hudCtx.moveTo(scr.x, scr.y);
        else hudCtx.lineTo(scr.x, scr.y);
      }
      if (state.cinematic) {
        hudCtx.lineWidth = 4;
        hudCtx.globalAlpha = 0.28;
        hudCtx.stroke();
        hudCtx.lineWidth = 1.5;
        hudCtx.globalAlpha = 1;
      }
      hudCtx.stroke();
      hudCtx.setLineDash([]);

      hudCtx.beginPath();
      hudCtx.moveTo(sx, sy);
      hudCtx.lineTo(cx, cy);
      hudCtx.strokeStyle = "#e5e7eb";
      hudCtx.lineWidth = 2;
      hudCtx.stroke();

      hudCtx.fillStyle = status === "IMPACT" ? "#f87171" : status === "ESCAPE" ? "#fbbf24" : "#38bdf8";
      hudCtx.font = "11px monospace";
      hudCtx.fillText(`${status} | SPEED: ${Math.hypot(vx, vy).toFixed(1)}`, cx + 12, cy - 8);
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - state.camera.x) / state.camera.zoom,
        y: (sy - state.camera.y) / state.camera.zoom
      };
    }

    function worldToScreen(wx, wy) {
      return {
        x: wx * state.camera.zoom + state.camera.x,
        y: wy * state.camera.zoom + state.camera.y
      };
    }

    /* =========================================================================
       MODULE 7: INTERACTION & INPUT CONTROLLER
       ========================================================================= */
    window.addEventListener("mousedown", (e) => {
      if (e.target.closest(".panel")) return;
      if (e.button === 0) {
        state.isDragging = true;
        state.dragStart = { x: e.clientX, y: e.clientY };
        state.dragCurrent = { x: e.clientX, y: e.clientY };
      } else if (e.button === 2) {
        state.isPanning = true;
        state.panStart = { x: e.clientX - state.camera.x, y: e.clientY - state.camera.y };
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (state.isDragging) {
        state.dragCurrent = { x: e.clientX, y: e.clientY };
      }
      if (state.isPanning) {
        state.camera.x = e.clientX - state.panStart.x;
        state.camera.y = e.clientY - state.panStart.y;
      }
    });

    window.addEventListener("mouseup", (e) => {
      if (state.isDragging && e.button === 0) {
        state.isDragging = false;
        const wPos = screenToWorld(state.dragStart.x, state.dragStart.y);
        const vx = (state.dragStart.x - e.clientX) * 0.06;
        const vy = (state.dragStart.y - e.clientY) * 0.06;
        const spec = ARCHETYPES[state.selectedArchetype];

        bodies.push({
          id: Date.now(),
          x: wPos.x,
          y: wPos.y,
          vx, vy,
          mass: spec.mass,
          radius: spec.radius,
          color: spec.color,
          type: state.selectedArchetype,
          trail: []
        });

        playTone(480, 0.1, "sine");
      }
      if (e.button === 2) state.isPanning = false;
    });

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    window.addEventListener("wheel", (e) => {
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      state.camera.zoom = Math.max(0.2, Math.min(state.camera.zoom * zoomFactor, 4.0));
    });

    document.getElementById("btn-pause").onclick = (e) => {
      state.paused = !state.paused;
      e.target.innerText = state.paused ? "Play" : "Pause";
      e.target.classList.toggle("active", state.paused);
    };

    document.getElementById("btn-step").onclick = () => {
      if (state.paused) {
        const subDt = DT / SUB_STEPS;
        for (let i = 0; i < SUB_STEPS; i++) stepPhysics(subDt);
      }
    };

    document.getElementById("btn-clear").onclick = () => { bodies = []; particles = []; };

    document.getElementById("btn-merge").onclick = (e) => {
      state.collisionMode = "merge";
      e.target.classList.add("active");
      document.getElementById("btn-shatter").classList.remove("active");
    };

    document.getElementById("btn-shatter").onclick = (e) => {
      state.collisionMode = "shatter";
      e.target.classList.add("active");
      document.getElementById("btn-merge").classList.remove("active");
    };

    document.getElementById("btn-grid").onclick = (e) => {
      state.showGrid = !state.showGrid;
      e.target.classList.toggle("active", state.showGrid);
    };

    document.getElementById("btn-trails").onclick = (e) => {
      state.showTrails = !state.showTrails;
      e.target.classList.toggle("active", state.showTrails);
    };

    document.getElementById("btn-fx").onclick = (e) => {
      state.cinematic = !state.cinematic;
      e.target.classList.toggle("active", state.cinematic);
    };

    document.getElementById("btn-audio").onclick = (e) => {
      state.audioEnabled = !state.audioEnabled;
      e.target.classList.toggle("active", state.audioEnabled);
      if (state.audioEnabled && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    };

    document.querySelectorAll(".archetype-btn").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll(".archetype-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.selectedArchetype = btn.dataset.type;
      };
    });

    document.getElementById("preset-select").onchange = (e) => loadPreset(e.target.value);

    /* =========================================================================
       MAIN LOOP
       ========================================================================= */
    let lastTime = performance.now();
    let frameCount = 0;
    let fpsTime = lastTime;

    function loop(now) {
      visualTime = now * 0.001;
      if (!state.paused) {
        const subDt = DT / SUB_STEPS;
        for (let i = 0; i < SUB_STEPS; i++) stepPhysics(subDt);
      }

      draw();

      frameCount++;
      if (now - fpsTime > 500) {
        document.getElementById("stat-fps").innerText = Math.round((frameCount * 1000) / (now - fpsTime));
        document.getElementById("stat-bodies").innerText = bodies.length;
        frameCount = 0;
        fpsTime = now;
      }

      requestAnimationFrame(loop);
    }

    loadPreset("binary");
    requestAnimationFrame(loop);
  </script>
</body>
</html>
